# Optional: run the Next.js app in Docker with SQLite (matches local default).
# For day-to-day development, prefer: npm run dev
services:
  app:
    build: .
    container_name: vaultforge-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: local-compose-secret-change-me
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    volumes:
      - vaultforge_data:/app/prisma

volumes:
  vaultforge_data:
