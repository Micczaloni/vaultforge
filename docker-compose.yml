services:
  db:
    image: postgres:16-alpine
    container_name: vaultforge-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaultforge
    volumes:
      - vaultforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vaultforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vaultforge_pg:
